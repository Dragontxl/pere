name = "pexel-remotion-worker"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "pexel-remotion-worker"
main = "src/index.ts"

[env.production.vars]
ADMIN_API_KEY = "${ADMIN_API_KEY}"
CALLBACK_SECRET = "${CALLBACK_SECRET}"
JWT_SECRET = "${JWT_SECRET}"
ENCRYPTION_KEY = "${ENCRYPTION_KEY}"
GITHUB_PAT = "${GITHUB_PAT}"
ENVIRONMENT = "production"
GITHUB_REPO_OWNER = "Dragontxl"
GITHUB_REPO_NAME = "pere"
FRONTEND_URL = "${FRONTEND_URL}"
R2_PUBLIC_URL = "${R2_PUBLIC_URL}"
CLOUDFLARE_API_TOKEN = "${CLOUDFLARE_API_TOKEN}"
CLOUDFLARE_ZONE_ID = "a591cd553ec34768475ee2010d4cd7ab"

[[env.production.d1_databases]]
binding = "DB"
database_name = "pexel-remotion-db"
database_id = "f4705826-ced3-4e40-97fd-2494e68cef79"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "pexel-remotion-bucket"

[env.production.assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"

[env.production.triggers]
# crons removed - Workers Free tier limit reached (5 per account)

[[env.production.routes]]
pattern = "pere.ygtxl.dpdns.org"
zone_name = "ygtxl.dpdns.org"
custom_domain = true

[vars]
ADMIN_API_KEY = "${ADMIN_API_KEY}"
CALLBACK_SECRET = "${CALLBACK_SECRET}"
JWT_SECRET = "${JWT_SECRET}"
ENCRYPTION_KEY = "${ENCRYPTION_KEY}"
GITHUB_PAT = "${GITHUB_PAT}"
ENVIRONMENT = "production"
GITHUB_REPO_OWNER = "Dragontxl"
GITHUB_REPO_NAME = "pere"
FRONTEND_URL = "${FRONTEND_URL}"
R2_PUBLIC_URL = "${R2_PUBLIC_URL}"
CLOUDFLARE_API_TOKEN = "${CLOUDFLARE_API_TOKEN}"
CLOUDFLARE_ZONE_ID = "a591cd553ec34768475ee2010d4cd7ab"

[[d1_databases]]
binding = "DB"
database_name = "pexel-remotion-db"
database_id = "f4705826-ced3-4e40-97fd-2494e68cef79"

[[r2_buckets]]
binding = "R2"
bucket_name = "pexel-remotion-bucket"

[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"

[[routes]]
pattern = "pere.ygtxl.dpdns.org"
zone_name = "ygtxl.dpdns.org"
custom_domain = true

# [triggers] - Removed: Workers Free tier limit of 5 cron triggers per account reached
