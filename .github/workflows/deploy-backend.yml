name: 部署后端

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        working-directory: backend
        run: npm install

      - name: 构建前端
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: 生成 index.html 嵌入文件
        working-directory: backend
        run: node generate-index-html.js

      - name: 执行数据库迁移
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute pexel-remotion-db --file=./src/database/schema.sql --remote

      # schema.sql 只用 CREATE TABLE IF NOT EXISTS，无法给已存在的表补列。
      # 这里逐条执行 ALTER TABLE，已存在时 wrangler 会报错，用 || 忽略即可保持幂等。
      - name: 应用增量迁移（幂等）
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          while IFS= read -r stmt || [ -n "$stmt" ]; do
            stmt="$(echo "$stmt" | sed 's/[[:space:]]*$//')"
            [ -z "$stmt" ] && continue
            case "$stmt" in --*) continue ;; esac
            npx wrangler d1 execute pexel-remotion-db --remote --command "$stmt" >/dev/null 2>&1 \
              && echo "applied: $stmt" \
              || echo "skip (already applied): $stmt"
          done < src/database/migrations/2026-11-20-tts-options.sql

      - name: 部署到 Cloudflare Workers
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          output=$(npx wrangler deploy 2>&1)
          echo "$output"
          # 提取部署生成的版本 ID，供后续 wrangler versions secret put 使用
          VERSION_ID=$(echo "$output" | grep -oP 'Current Version ID:\s*\K[a-f0-9-]+')
          if [ -z "$VERSION_ID" ]; then
            # 回退：从 versions list 中取最新
            VERSION_ID=$(npx wrangler versions list 2>/dev/null | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -1)
          fi
          if [ -z "$VERSION_ID" ]; then
            echo "::error::无法获取 Worker 版本 ID，后续 Secrets 配置将无法进行"
            exit 1
          fi
          echo "VERSION_ID=$VERSION_ID" >> $GITHUB_ENV

      # Secrets cannot live in wrangler.toml: wrangler does not expand ${VAR}
      # placeholders, so they must be uploaded with `wrangler secret put`.
      # 使用 `wrangler versions secret put --version <id>` 而非 `wrangler secret put`：
      # 后者在第一次写入后会改变版本绑定状态，导致后续 secret 写入报
      # "the latest version of your Worker isn't currently deployed"。
      - name: 配置 Worker Secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
        run: |
          for name in ADMIN_API_KEY CALLBACK_SECRET JWT_SECRET ENCRYPTION_KEY GITHUB_PAT; do
            value="$(printenv "$name")"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler versions secret put "$name" --version "$VERSION_ID"
            else
              echo "::warning::secret $name is empty, skipped"
            fi
          done
