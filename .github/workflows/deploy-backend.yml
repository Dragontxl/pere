name: 部署后端

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        working-directory: backend
        run: npm install

      - name: 构建前端
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: 生成 index.html 嵌入文件
        working-directory: backend
        run: node generate-index-html.js

      - name: 执行数据库迁移
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute pexel-remotion-db --file=./src/database/schema.sql --remote

      - name: 部署到 Cloudflare Workers
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: npx wrangler deploy

      # Secrets cannot live in wrangler.toml: wrangler does not expand ${VAR}
      # placeholders, so they must be uploaded with `wrangler secret put`.
      - name: 配置 Worker Secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
        run: |
          for name in ADMIN_API_KEY CALLBACK_SECRET JWT_SECRET ENCRYPTION_KEY GITHUB_PAT; do
            value="$(printenv "$name")"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "::warning::secret $name is empty, skipped"
            fi
          done
