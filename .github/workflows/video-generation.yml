name: 视频生成

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: '任务ID'
        required: true
        type: string
      article_content:
        description: '文章内容（直接粘贴，与 file_key 二选一）'
        required: false
        type: string
      article_file_key:
        description: 'R2 中的文章文件 Key（与 content 二选一）'
        required: false
        type: string
      topic:
        description: '话题（填写则用 AI 生成文章，优先于 content/file_key）'
        required: false
        type: string
      orientation:
        description: '图片方向'
        required: false
        default: 'landscape'
        type: choice
        options:
          - landscape
          - portrait
      language:
        description: '文章语言'
        required: false
        default: 'zh'
        type: choice
        options:
          - zh
          - en
      start_phase:
        description: '起始阶段'
        required: false
        default: 'SCENE_GEN'
        type: choice
        options:
          - SCENE_GEN
          - ASSET_MATCH
          - REMOTION_RENDER
          - TTS_COMPOSE
      end_phase:
        description: '结束阶段'
        required: false
        default: 'TTS_COMPOSE'
        type: choice
        options:
          - SCENE_GEN
          - ASSET_MATCH
          - REMOTION_RENDER
          - TTS_COMPOSE

  repository_dispatch:
    types: [video-generation]

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt

      - name: 配置 ffmpeg 路径
        shell: pwsh
        run: |
          # imageio-ffmpeg 自带 ffmpeg 二进制，通过环境变量让 Python 代码找到它
          $ffmpegPath = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if ($ffmpegPath) {
            Add-Content -Path $env:GITHUB_ENV -Value "IMAGEIO_FFMPEG_EXE=$ffmpegPath"
            Write-Host "ffmpeg: $ffmpegPath"
          } else {
            Write-Warning "imageio-ffmpeg not found, falling back to system ffmpeg"
          }

      - name: 安装 Node.js 依赖
        run: |
          cd remotion && npm install

      - name: 配置 ImageMagick
        run: choco install imagemagick --no-wait

      - name: 归一化任务参数
        id: params
        shell: pwsh
        run: |
          # `GITHUB_EVENT` is not a real GitHub Actions variable - the event payload
          # is only available as a JSON file behind GITHUB_EVENT_PATH.
          $payload = $null
          if ($env:GITHUB_EVENT_PATH -and (Test-Path $env:GITHUB_EVENT_PATH)) {
            $event = Get-Content -Path $env:GITHUB_EVENT_PATH -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($event.PSObject.Properties.Name -contains 'client_payload' -and $event.client_payload) {
              $payload = $event.client_payload
            }
          }

          if ($payload) {
            $task_id = $payload.task_id
            $article_source = $payload.article_source
            $article_content = $payload.article_content
            $article_file_key = $payload.article_file_key
            $orientation = $payload.orientation
            $language = $payload.language
            $enable_subtitle = $payload.enable_subtitle
            $bgm_key = $payload.bgm_key
            $start_phase = $payload.start_phase
            $end_phase = $payload.end_phase
            $rerender_clips = $payload.rerender_clips
            $rerender_image = $payload.rerender_image
            $rerender_type = $payload.rerender_type
          } else {
            $task_id = "${{ inputs.task_id }}"
            $article_source = "pasted"
            $article_content = "${{ inputs.article_content }}"
            $article_file_key = "${{ inputs.article_file_key }}"
            $orientation = "${{ inputs.orientation }}"
            $language = "${{ inputs.language }}"
            $enable_subtitle = "true"
            $bgm_key = ""
            $start_phase = "${{ inputs.start_phase }}"
            $end_phase = "${{ inputs.end_phase }}"
            $rerender_clips = ""
            $rerender_image = @()
            $rerender_type = @()
          }

          # 缺省值兜底
          if (-not $article_source) { $article_source = "pasted" }
          if (-not $orientation) { $orientation = "landscape" }
          if (-not $language) { $language = "zh" }
          if (-not $start_phase) { $start_phase = "SCENE_GEN" }
          if (-not $end_phase) { $end_phase = "TTS_COMPOSE" }
          if (-not $bgm_key) { $bgm_key = "" }
          if (-not $rerender_clips) { $rerender_clips = "" }
          if (-not $rerender_image) { $rerender_image = @() }
          if (-not $rerender_type) { $rerender_type = @() }
          if ("$enable_subtitle" -match '^(?i)false$') { $enable_subtitle = "false" } else { $enable_subtitle = "true" }
          $article_content = [string]$article_content
          $article_file_key = [string]$article_file_key
          $bgm_key = [string]$bgm_key
          $rerender_clips = [string]$rerender_clips

          # 写入环境变量供后续步骤使用（文章正文可能是多行，必须用分隔符语法）
          Add-Content -Path $env:GITHUB_ENV -Value "TASK_ID=$task_id"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTICLE_SOURCE=$article_source"
          $delimiter = "ARTICLE_EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTICLE_CONTENT<<$delimiter"
          Add-Content -Path $env:GITHUB_ENV -Value $article_content
          Add-Content -Path $env:GITHUB_ENV -Value $delimiter
          Add-Content -Path $env:GITHUB_ENV -Value "ARTICLE_FILE_KEY=$article_file_key"
          Add-Content -Path $env:GITHUB_ENV -Value "ORIENTATION=$orientation"
          Add-Content -Path $env:GITHUB_ENV -Value "LANGUAGE=$language"
          Add-Content -Path $env:GITHUB_ENV -Value "ENABLE_SUBTITLE=$enable_subtitle"
          Add-Content -Path $env:GITHUB_ENV -Value "BGM_KEY=$bgm_key"
          Add-Content -Path $env:GITHUB_ENV -Value "START_PHASE=$start_phase"
          Add-Content -Path $env:GITHUB_ENV -Value "END_PHASE=$end_phase"
          Add-Content -Path $env:GITHUB_ENV -Value "RERENDER_CLIPS=$rerender_clips"

          $phase_order = @('SCENE_GEN', 'ASSET_MATCH', 'REMOTION_RENDER', 'TTS_COMPOSE')
          $start_idx = [array]::IndexOf($phase_order, $start_phase)
          $end_idx = [array]::IndexOf($phase_order, $end_phase)
          if ($start_idx -lt 0) { $start_idx = 0 }
          if ($end_idx -lt 0) { $end_idx = 3 }
          if ($end_idx -lt $start_idx) { $end_idx = $start_idx }

          Add-Content -Path $env:GITHUB_ENV -Value "START_PHASE_IDX=$start_idx"
          Add-Content -Path $env:GITHUB_ENV -Value "END_PHASE_IDX=$end_idx"

          Write-Host "Task: $task_id"
          Write-Host "Phases: $start_phase ($start_idx) → $end_phase ($end_idx)"
          Write-Host "Article source: $article_source"
          Write-Host "Article file key: $article_file_key"

      - name: 下载文章文件（R2）
        if: ${{ env.ARTICLE_FILE_KEY != '' }}
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler 4 语法：对象路径是位置参数
          npx --yes wrangler r2 object get `
            "${{ secrets.R2_BUCKET_NAME }}/${{ env.ARTICLE_FILE_KEY }}" `
            --file article_download.txt --remote 2>&1

          if (Test-Path article_download.txt) {
            Copy-Item article_download.txt article.txt -Force
            Write-Host "Article file downloaded from R2: ${{ env.ARTICLE_FILE_KEY }}"
          } else {
            Write-Error "Failed to download article file from R2"
          }

      - name: 保存文章内容
        if: ${{ env.ARTICLE_FILE_KEY == '' && env.ARTICLE_CONTENT != '' }}
        shell: pwsh
        run: |
          # 将文章内容写入文件
          [System.IO.File]::WriteAllText(
            "$PWD\article.txt",
            $env:ARTICLE_CONTENT,
            [System.Text.Encoding]::UTF8
          )
          Write-Host "Article content saved to article.txt ($($env:ARTICLE_CONTENT.Length) chars)"

      - name: 发送阶段开始回调
        shell: pwsh
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          Write-Host "Sending phase start callback for task $env:TASK_ID"
          # Import the same HMAC signing logic used by the backend
          $secret = $env:CALLBACK_SECRET
          $payload = @{
            task_id = $env:TASK_ID
            phase = $env:START_PHASE
            status = 'started'
            message = "Phase $env:START_PHASE started"
          } | ConvertTo-Json -Compress

          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $hash = [System.Convert]::ToBase64String($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($payload)))

          $headers = @{
            "Content-Type" = "application/json"
            "X-Callback-Signature" = $hash
          }

          try {
            $resp = Invoke-RestMethod -Uri $env:CALLBACK_URL -Method Post -Headers $headers -Body $payload
            Write-Host "Callback response: $($resp | ConvertTo-Json -Compress)"
          } catch {
            Write-Host "Callback send failed (will continue): $($_.Exception.Message)"
          }

      - name: 执行视频生成
        id: generate
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_API_URL: ${{ secrets.TTS_API_URL }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: pwsh
        run: |
          # 构建命令行参数
          $cmd = @(
            "python", "main.py",
            "--task-id", $env:TASK_ID,
            "--article-source", $env:ARTICLE_SOURCE,
            "--start-phase", $env:START_PHASE,
            "--end-phase", $env:END_PHASE,
            "--orientation", $env:ORIENTATION,
            "--language", $env:LANGUAGE,
            "--output-dir", "./output",
            "--callback-url", $env:CALLBACK_URL,
            "--callback-secret", $env:CALLBACK_SECRET,
            "--r2-prefix", "tasks/$env:TASK_ID",
            "--r2-bucket", $env:R2_BUCKET_NAME,
            "--r2-access-key-id", $env:R2_ACCESS_KEY_ID,
            "--r2-secret-access-key", $env:R2_SECRET_ACCESS_KEY,
            "--r2-endpoint", $env:R2_ENDPOINT_URL
          )

          if ($env:ARTICLE_FILE_KEY -ne "") {
            $cmd += @("--article-file", "article.txt")
          } elseif ($env:ARTICLE_CONTENT -ne "") {
            $cmd += @("--article-file", "article.txt")
          }

          if ($env:ENABLE_SUBTITLE -eq "false") {
            $cmd += @("--no-subtitle")
          }

          if ($env:RERENDER_CLIPS -ne "") {
            $cmd += @("--rerender-clips", $env:RERENDER_CLIPS)
          }

          # Rerender image overrides (array from payload)
          if ($rerender_image -and $rerender_image.Count -gt 0) {
            foreach ($img in $rerender_image) {
              $cmd += @("--rerender-image", $img)
            }
          }

          # Rerender type overrides (array from payload)
          if ($rerender_type -and $rerender_type.Count -gt 0) {
            foreach ($tp in $rerender_type) {
              $cmd += @("--rerender-type", $tp)
            }
          }

          if ($env:BGM_KEY -ne "") {
            if ($env:BGM_KEY -like "bgm/*") {
              # 自定义 BGM：从 R2 下载到本地文件，再传给 main.py
              $bgmFileName = Split-Path $env:BGM_KEY -Leaf
              $localBgmPath = "assets/bgm/$bgmFileName"
              Write-Host "BGM_KEY 是自定义上传，从 R2 下载: $env:BGM_KEY -> $localBgmPath"
              npx --yes wrangler r2 object get "$env:R2_BUCKET_NAME/$env:BGM_KEY" --file $localBgmPath --remote 2>&1
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Failed to download custom BGM from R2"
                exit 1
              }
              $cmd += @("--bgm", $localBgmPath)
            } else {
              # 预设 BGM：使用仓库中的文件
              $cmd += @("--bgm", "assets/bgm/$env:BGM_KEY")
            }
          }

          $cmdLine = $cmd -join " "
          Write-Host "Running: $cmdLine"

          # 执行并捕获退出码（& $cmd 会把整个数组当成命令名，必须分开传参）
          $exe = $cmd[0]
          $cmdArgs = @($cmd[1..($cmd.Count - 1)])
          & $exe @cmdArgs
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Error "Video generation failed with exit code $exitCode"
            exit $exitCode
          }

      - name: 上传中间产物到 R2
        if: ${{ always() && steps.generate.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 上传 scenes.json、match_results.json、decisions.json 到 R2
          $prefix = "tasks/$env:TASK_ID"

          $filesToUpload = @(
            "output/scenes.json",
            "output/match_results.json",
            "output/decisions.json"
          )

          foreach ($file in $filesToUpload) {
            if (Test-Path $file) {
              $r2Key = "$prefix/$([System.IO.Path]::GetFileName($file))"
              Write-Host "Uploading $file -> $r2Key"

              # wrangler 4 语法：对象路径是位置参数（不是 --bucket/--key）
              npx --yes wrangler r2 object put "$env:R2_BUCKET_NAME/$r2Key" --file $file --remote 2>&1

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Failed to upload $file to R2 (continuing)"
              }
            } else {
              Write-Warning "$file not found, skipping upload"
            }
          }

          # 上传最终视频：混合 BGM 后 main.py 会将 final_output.mp4 重命名为
          # final_with_bgm.mp4，统一以 final_output.mp4 作为 R2 key，保证下载链接一致
          $finalVideo = @(
            "output/final_output.mp4",
            "output/final_with_bgm.mp4"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($finalVideo) {
            $r2Key = "$prefix/final_output.mp4"
            Write-Host "Uploading $finalVideo -> $r2Key"
            npx --yes wrangler r2 object put "$env:R2_BUCKET_NAME/$r2Key" --file $finalVideo --remote 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to upload final video to R2 (continuing)"
            }
          } else {
            Write-Warning "No final video found, skipping upload"
          }

      - name: 发送进度回调
        if: ${{ always() }}
        shell: pwsh
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $secret = $env:CALLBACK_SECRET
          $phase = $env:END_PHASE
          # GitHub 没有 GITHUB_RUN_RESULT 这个变量，job.status 才是当前作业状态
          $status = if ($env:JOB_STATUS -eq 'success') { 'completed' } else { 'failed' }
          $message = "Phase $phase $status"

          $payload = @{
            task_id = $env:TASK_ID
            phase = $phase
            status = $status
            start_phase = $env:START_PHASE
            end_phase = $env:END_PHASE
            message = $message
            processed_count = 1
            total_count = 1
          } | ConvertTo-Json -Compress

          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $hash = [System.Convert]::ToBase64String($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($payload)))

          $headers = @{
            "Content-Type" = "application/json"
            "X-Callback-Signature" = $hash
          }

          try {
            $resp = Invoke-RestMethod -Uri $env:CALLBACK_URL -Method Post -Headers $headers -Body $payload
            Write-Host "Progress callback response: $($resp | ConvertTo-Json -Compress)"
          } catch {
            Write-Host "Progress callback failed (will continue): $($_.Exception.Message)"
          }

      - name: 发送错误回调
        if: ${{ failure() }}
        shell: pwsh
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          $secret = $env:CALLBACK_SECRET
          $payload = @{
            task_id = $env:TASK_ID
            phase = $env:START_PHASE
            status = 'failed'
            error = "GitHub Actions workflow failed"
          } | ConvertTo-Json -Compress

          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $hash = [System.Convert]::ToBase64String($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($payload)))

          $headers = @{
            "Content-Type" = "application/json"
            "X-Callback-Signature" = $hash
          }

          try {
            $resp = Invoke-RestMethod -Uri $env:CALLBACK_URL -Method Post -Headers $headers -Body $payload
            Write-Host "Error callback response: $($resp | ConvertTo-Json -Compress)"
          } catch {
            Write-Host "Error callback failed: $($_.Exception.Message)"
          }

      - name: 上传视频产物
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ env.TASK_ID }}
          path: output/**/*.mp4
          retention-days: 7
