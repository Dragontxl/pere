name: 视频生成

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: '任务ID'
        required: true
        type: string
      article_content:
        description: '文章内容（直接粘贴，与 file_key 二选一）'
        required: false
        type: string
      article_file_key:
        description: 'R2 中的文章文件 Key（与 content 二选一）'
        required: false
        type: string
      topic:
        description: '话题（填写则用 AI 生成文章，优先于 content/file_key）'
        required: false
        type: string
      title:
        description: '项目名称（用作封面搜索关键词与叠加文字，留空则无封面）'
        required: false
        type: string
      orientation:
        description: '图片方向'
        required: false
        default: 'landscape'
        type: choice
        options:
          - landscape
          - portrait
      language:
        description: '文章语言'
        required: false
        default: 'zh'
        type: choice
        options:
          - zh
          - en
      start_phase:
        description: '起始阶段'
        required: false
        default: 'ARTICLE_PARSE'
        type: choice
        options:
          - ARTICLE_PARSE
          - SCENE_GEN
          - IMAGE_DOWNLOAD
          - ASSET_MATCH
          - RENDER_DECISION
          - TTS_SYNTH
          - VIDEO_COMPOSE
      end_phase:
        description: '结束阶段'
        required: false
        default: 'VIDEO_COMPOSE'
        type: choice
        options:
          - ARTICLE_PARSE
          - SCENE_GEN
          - IMAGE_DOWNLOAD
          - ASSET_MATCH
          - RENDER_DECISION
          - TTS_SYNTH
          - VIDEO_COMPOSE
      enable_subtitle:
        description: '是否烧录字幕'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      bgm_key:
        description: '背景音乐 Key（bgm/xxx 为自定义，其他为预设）'
        required: false
        type: string
      rerender_clips:
        description: '重新渲染指定场景（与上面参数互斥，填了则跳过完整管线）'
        required: false
        type: string

  repository_dispatch:
    types: [video-generation]

permissions:
  contents: read

env:
  # 从 workflow_dispatch 或 repository_dispatch 中提取公共参数
  TASK_ID: ${{ github.event.inputs.task_id || github.event.client_payload.task.task_id || '' }}
  ENABLE_SUBTITLE: ${{ github.event.inputs.enable_subtitle || github.event.client_payload.task.enable_subtitle || 'true' }}
  BGM_KEY: ${{ github.event.inputs.bgm_key || github.event.client_payload.task.bgm_key || '' }}
  LANGUAGE: ${{ github.event.inputs.language || github.event.client_payload.task.language || 'zh' }}
  ORIENTATION: ${{ github.event.inputs.orientation || github.event.client_payload.task.orientation || 'landscape' }}
  RERENDER_CLIPS: ${{ github.event.inputs.rerender_clips || github.event.client_payload.task.rerender_clips || '' }}
  TITLE: ${{ github.event.inputs.title || github.event.client_payload.task.title || '' }}

jobs:
  # ══════════════════════════════════════════════════════════════
  # Job 1: Pipeline — ARTICLE_PARSE → SCENE_GEN → IMAGE_DOWNLOAD → ASSET_MATCH → RENDER_DECISION → TTS_SYNTH
  # 产出：scenes.json, match_results.json, decisions.json, render_manifest.json,
  #       音频段, 图片 — 全部上传 R2 供渲染 job 下载
  # ══════════════════════════════════════════════════════════════
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 设置 Node.js
        if: ${{ env.RERENDER_CLIPS != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
          retention-days: 14

      - name: 缓存 npm 依赖
        if: ${{ env.RERENDER_CLIPS != '' }}
        uses: actions/cache@v4
        with:
          path: remotion/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
          retention-days: 14

      - name: 缓存 apt 包
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-v3
          retention-days: 7

      - name: 安装系统依赖
        run: |
          sudo apt-get update -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 imagemagick fonts-noto-cjk ffmpeg
          sudo rm -rf /var/lib/apt/lists/*

      - name: 安装 Python 依赖
        run: |
          # 先装 CPU 版 torch：默认 PyPI 的 torch 是 CUDA 版，会额外拉数 GB 的
          # nvidia-* 运行时，CI 无 GPU 完全用不上。装好 CPU 版后，
          # 下面 pip install -r requirements.txt 会认为 torch 已满足而跳过
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true
          pip install -r requirements.txt

      - name: 安装 Node.js 依赖
        if: ${{ env.RERENDER_CLIPS != '' }}
        run: |
          cd remotion && npm install

      - name: 配置 ffmpeg 路径
        run: |
          ffmpegPath=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          if [ -n "$ffmpegPath" ]; then
            echo "IMAGEIO_FFMPEG_EXE=$ffmpegPath" >> $GITHUB_ENV
            echo "ffmpeg: $ffmpegPath"
          else
            echo "::warning::imageio-ffmpeg not found, falling back to system ffmpeg"
          fi

      - name: 归一化任务参数
        id: params
        shell: bash
        run: |
          payload=""
          if [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            event=$(cat "$GITHUB_EVENT_PATH")
            if echo "$event" | grep -q '"client_payload"'; then
              payload=$(echo "$event" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('client_payload',{})))")
            fi
          fi

          if [ -n "$payload" ] && [ "$payload" != "{}" ]; then
            # 后端将参数打包在 client_payload.task 嵌套对象中（GitHub 限制顶层属性 ≤10）
            task_obj=$(echo "$payload" | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin).get('task',{})))")
            task_id=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('task_id',''))")
            title=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('title',''))")
            article_source=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('article_source','pasted'))")
            article_content=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('article_content',''))")
            article_file_key=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('article_file_key',''))")
            orientation=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('orientation','landscape'))")
            language=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('language','zh'))")
            enable_subtitle=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('enable_subtitle','true'))")
            bgm_key=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('bgm_key',''))")
            start_phase=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('start_phase','ARTICLE_PARSE'))")
            end_phase=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('end_phase','VIDEO_COMPOSE'))")
            rerender_clips=$(echo "$task_obj" | python3 -c "import sys,json; print(json.load(sys.stdin).get('rerender_clips',''))")
          else
            task_id="${{ inputs.task_id }}"
            title="${{ inputs.title }}"
            article_source="pasted"
            article_content="${{ inputs.article_content }}"
            article_file_key="${{ inputs.article_file_key }}"
            orientation="${{ inputs.orientation }}"
            language="${{ inputs.language }}"
            enable_subtitle="${{ inputs.enable_subtitle }}"
            bgm_key="${{ inputs.bgm_key }}"
            start_phase="${{ inputs.start_phase }}"
            end_phase="${{ inputs.end_phase }}"
            rerender_clips="${{ inputs.rerender_clips }}"
          fi

          # 缺省值兜底
          [ -z "$article_source" ] && article_source="pasted"
          [ -z "$orientation" ] && orientation="landscape"
          [ -z "$language" ] && language="zh"
          [ -z "$start_phase" ] && start_phase="ARTICLE_PARSE"
          [ -z "$end_phase" ] && end_phase="VIDEO_COMPOSE"
          [ -z "$bgm_key" ] && bgm_key=""
          [ -z "$rerender_clips" ] && rerender_clips=""
          if [ "$enable_subtitle" = "false" ] || [ "$enable_subtitle" = "False" ]; then
            enable_subtitle="false"
          else
            enable_subtitle="true"
          fi

          # 写入环境变量
          echo "TASK_ID=$task_id" >> $GITHUB_ENV
          echo "ARTICLE_SOURCE=$article_source" >> $GITHUB_ENV
          echo "ARTICLE_CONTENT<<EOF_ARTICLE" >> $GITHUB_ENV
          echo "$article_content" >> $GITHUB_ENV
          echo "EOF_ARTICLE" >> $GITHUB_ENV
          echo "ARTICLE_FILE_KEY=$article_file_key" >> $GITHUB_ENV
          echo "ORIENTATION=$orientation" >> $GITHUB_ENV
          echo "LANGUAGE=$language" >> $GITHUB_ENV
          echo "ENABLE_SUBTITLE=$enable_subtitle" >> $GITHUB_ENV
          echo "BGM_KEY=$bgm_key" >> $GITHUB_ENV
          echo "START_PHASE=$start_phase" >> $GITHUB_ENV
          echo "END_PHASE=$end_phase" >> $GITHUB_ENV
          echo "RERENDER_CLIPS=$rerender_clips" >> $GITHUB_ENV
          echo "TITLE=$title" >> $GITHUB_ENV

          phase_order=(ARTICLE_PARSE SCENE_GEN IMAGE_DOWNLOAD ASSET_MATCH RENDER_DECISION TTS_SYNTH VIDEO_COMPOSE)
          start_idx=$(printf "%s\n" "${phase_order[@]}" | grep -n "$start_phase" | head -1 | cut -d: -f1)
          end_idx=$(printf "%s\n" "${phase_order[@]}" | grep -n "$end_phase" | head -1 | cut -d: -f1)
          [ -z "$start_idx" ] && start_idx=1
          [ -z "$end_idx" ] && end_idx=7
          [ "$end_idx" -lt "$start_idx" ] && end_idx=$start_idx

          echo "START_PHASE_IDX=$((start_idx - 1))" >> $GITHUB_ENV
          echo "END_PHASE_IDX=$((end_idx - 1))" >> $GITHUB_ENV

          # 输出给下游 job
          echo "task_id=$task_id" >> $GITHUB_OUTPUT
          echo "rerender_clips=$rerender_clips" >> $GITHUB_OUTPUT
          echo "enable_subtitle=$enable_subtitle" >> $GITHUB_OUTPUT
          echo "bgm_key=$bgm_key" >> $GITHUB_OUTPUT
          echo "language=$language" >> $GITHUB_OUTPUT
          echo "title=$title" >> $GITHUB_OUTPUT
          echo "orientation=$orientation" >> $GITHUB_OUTPUT

          echo "Task: $task_id"
          echo "Phases: $start_phase ($((start_idx - 1))) -> $end_phase ($((end_idx - 1)))"

      - name: 下载文章文件（R2）
        if: ${{ env.ARTICLE_FILE_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler r2 object get \
            "${{ secrets.R2_BUCKET_NAME }}/${{ env.ARTICLE_FILE_KEY }}" \
            --file article_download.txt --remote 2>&1
          if [ -f article_download.txt ]; then
            cp article_download.txt article.txt
            echo "Article file downloaded from R2: ${{ env.ARTICLE_FILE_KEY }}"
          else
            echo "::error::Failed to download article file from R2"
            exit 1
          fi

      - name: 保存文章内容
        if: ${{ env.ARTICLE_FILE_KEY == '' && env.ARTICLE_CONTENT != '' }}
        run: |
          printf '%s' "$ARTICLE_CONTENT" > article.txt
          echo "Article content saved to article.txt ($(wc -c < article.txt) bytes)"

      - name: 发送阶段开始回调
        shell: bash
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          echo "Sending phase start callback for task $TASK_ID"
          secret="$CALLBACK_SECRET"
          payload=$(python3 -c "
          import json, hmac, hashlib, base64, os
          body = json.dumps({'task_id': os.environ['TASK_ID'], 'phase': os.environ['START_PHASE'], 'status': 'started', 'message': 'Phase ' + os.environ['START_PHASE'] + ' started'})
          sig = base64.b64encode(hmac.new(os.environ['CALLBACK_SECRET'].encode(), body.encode(), hashlib.sha256).digest()).decode()
          print(json.dumps({'payload': body, 'signature': sig}))
          ")
          payload_body=$(echo "$payload" | python3 -c "import sys,json; print(json.load(sys.stdin)['payload'])")
          payload_sig=$(echo "$payload" | python3 -c "import sys,json; print(json.load(sys.stdin)['signature'])")
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Signature: $payload_sig" \
            -d "$payload_body" || echo "Callback send failed (will continue)"

      - name: 执行流水线（SCENE_GEN → TTS）
        id: generate
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_API_URL: ${{ secrets.TTS_API_URL }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          cmd=(
            "python" "main.py"
            "--task-id" "$TASK_ID"
            "--title" "$TITLE"
            "--article-source" "$ARTICLE_SOURCE"
            "--start-phase" "$START_PHASE"
            "--end-phase" "$END_PHASE"
            "--orientation" "$ORIENTATION"
            "--language" "$LANGUAGE"
            "--output-dir" "./output"
            "--callback-url" "$CALLBACK_URL"
            "--callback-secret" "$CALLBACK_SECRET"
            "--r2-prefix" "tasks/$TASK_ID"
            "--r2-bucket" "$R2_BUCKET_NAME"
            "--r2-access-key-id" "$R2_ACCESS_KEY_ID"
            "--r2-secret-access-key" "$R2_SECRET_ACCESS_KEY"
            "--r2-endpoint" "$R2_ENDPOINT_URL"
          )

          if [ -n "$ARTICLE_FILE_KEY" ] || [ -n "$ARTICLE_CONTENT" ]; then
            cmd+=("--article-file" "article.txt")
          fi

          if [ "$ENABLE_SUBTITLE" = "false" ]; then
            cmd+=("--no-subtitle")
          fi

          if [ -n "$RERENDER_CLIPS" ]; then
            cmd+=("--rerender-clips" "$RERENDER_CLIPS")
          fi

          if [ -z "$RERENDER_CLIPS" ]; then
            # 分片渲染模式：TTS 后停止，渲染由独立 job 执行
            cmd+=("--render-shards" "4")
          fi

          if [ -n "$BGM_KEY" ]; then
            if [[ "$BGM_KEY" == bgm/* ]]; then
              bgm_filename=$(basename "$BGM_KEY")
              local_bgm="assets/bgm/$bgm_filename"
              echo "BGM_KEY is custom upload, downloading from R2: $BGM_KEY -> $local_bgm"
              npx --yes wrangler r2 object get "$R2_BUCKET_NAME/$BGM_KEY" --file "$local_bgm" --remote 2>&1
              if [ $? -ne 0 ]; then
                echo "::error::Failed to download custom BGM from R2"
                exit 1
              fi
              cmd+=("--bgm" "$local_bgm")
            else
              cmd+=("--bgm" "assets/bgm/$BGM_KEY")
            fi
          fi

          echo "Running: ${cmd[*]}"
          "${cmd[@]}"
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "::error::Video generation failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: 上传中间产物到 R2
        if: ${{ always() && steps.generate.outcome == 'success' }}
        continue-on-error: true
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          prefix="tasks/$TASK_ID"
          for file in output/scenes.json output/match_results.json output/decisions.json output/render_manifest.json output/article.txt; do
            if [ -f "$file" ]; then
              r2_key="$prefix/$(basename "$file")"
              echo "Uploading $file -> $r2_key"
              npx --yes wrangler r2 object put "$R2_BUCKET_NAME/$r2_key" --file "$file" --remote 2>&1
            fi
          done

      - name: 发送错误回调
        if: ${{ failure() }}
        shell: bash
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          payload=$(python3 -c "
          import json, hmac, hashlib, base64, os
          body = json.dumps({'task_id': os.environ['TASK_ID'], 'phase': os.environ['START_PHASE'], 'status': 'failed', 'error': 'GitHub Actions pipeline job failed'})
          sig = base64.b64encode(hmac.new(os.environ['CALLBACK_SECRET'].encode(), body.encode(), hashlib.sha256).digest()).decode()
          print(json.dumps({'payload': body, 'signature': sig}))
          ")
          payload_body=$(echo "$payload" | python3 -c "import sys,json; print(json.load(sys.stdin)['payload'])")
          payload_sig=$(echo "$payload" | python3 -c "import sys,json; print(json.load(sys.stdin)['signature'])")
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Signature: $payload_sig" \
            -d "$payload_body" || true

    outputs:
      task_id: ${{ steps.params.outputs.task_id }}
      rerender_clips: ${{ steps.params.outputs.rerender_clips }}
      enable_subtitle: ${{ steps.params.outputs.enable_subtitle }}
      bgm_key: ${{ steps.params.outputs.bgm_key }}
      language: ${{ steps.params.outputs.language }}
      title: ${{ steps.params.outputs.title }}
      orientation: ${{ steps.params.outputs.orientation }}

  # ══════════════════════════════════════════════════════════════
  # Job 1b: Setup Deps — 集中安装系统依赖，打包上传 artifact
  # 4 个 render job 并发跑 apt-get 会争抢 Ubuntu 镜像带宽，
  # 导致部分 job 安装耗时 20s~800s 不等。抽离为单一 job，
  # render job 通过 artifact 离线安装，彻底消除并发争抢。
  # ══════════════════════════════════════════════════════════════
  setup-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖并打包
        run: |
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5 \
            imagemagick fonts-noto-cjk ffmpeg
          # 打包 .deb 文件供 render job 离线安装（无需访问镜像源）
          mkdir -p /tmp/apt-packages
          cp /var/cache/apt/archives/*.deb /tmp/apt-packages/ 2>/dev/null || true
          tar czf apt-packages.tar.gz -C /tmp/apt-packages .
          echo "apt packages packaged: $(ls /tmp/apt-packages/*.deb 2>/dev/null | wc -l) deb files, $(du -h apt-packages.tar.gz | cut -f1)"
      - name: 上传 apt 包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: apt-packages
          path: apt-packages.tar.gz
          retention-days: 1

      # 预下载 render/assembly 所需的轻量依赖 wheels，下游离线安装
      - name: 预下载 core 依赖 wheels
        run: |
          mkdir -p /tmp/py-wheels
          pip download -r requirements-core.txt -d /tmp/py-wheels
          tar czf py-wheels-core.tar.gz -C /tmp/py-wheels .
          echo "core wheels packaged: $(ls /tmp/py-wheels | wc -l) files, $(du -h py-wheels-core.tar.gz | cut -f1)"
      - name: 上传 wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: py-wheels-core
          path: py-wheels-core.tar.gz
          retention-days: 1

  # ══════════════════════════════════════════════════════════════
  # Job 2: Render — 并行渲染分片（4 个 Ubuntu runner）
  # 每个 job 下载 R2 产物，渲染分配的片段，上传回 R2
  # ══════════════════════════════════════════════════════════════
  render:
    needs: [pipeline, setup-deps]
    # 重渲染模式不需要渲染 job
    if: ${{ needs.pipeline.outputs.rerender_clips == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        with:
          path: remotion/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
          retention-days: 14

      - name: 下载 apt 包并离线安装
        uses: actions/download-artifact@v4
        with:
          name: apt-packages
          path: /tmp/apt-packages
      - name: 离线安装系统依赖
        run: |
          # 从 artifact 中的 .deb 文件离线安装，无需访问 Ubuntu 镜像源
          # 消除 4 个 render job 并发 apt-get 争抢镜像带宽的问题
          cd /tmp/apt-packages
          tar xzf apt-packages.tar.gz
          sudo dpkg -i *.deb 2>/dev/null || sudo apt-get install -f -y -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          sudo rm -rf /var/lib/apt/lists/*

      - name: 下载 core 依赖 wheels
        uses: actions/download-artifact@v4
        with:
          name: py-wheels-core
          path: /tmp/py-wheels

      - name: 安装 Python 依赖（离线优先）
        run: |
          # 只安装 render 需要的轻量依赖（不含 torch/transformers）
          # 优先从 setup-deps 预下载的 wheels 离线安装，失败则回退在线
          tar xzf /tmp/py-wheels/py-wheels-core.tar.gz -C /tmp/py-wheels
          pip install --no-index --find-links /tmp/py-wheels -r requirements-core.txt \
            || pip install -r requirements-core.txt

      - name: 安装 Node.js 依赖
        run: |
          cd remotion && npm install

      - name: 配置 ffmpeg 路径
        run: |
          ffmpegPath=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          if [ -n "$ffmpegPath" ]; then
            echo "IMAGEIO_FFMPEG_EXE=$ffmpegPath" >> $GITHUB_ENV
            echo "ffmpeg: $ffmpegPath"
          fi
          echo "ffprobe: $(command -v ffprobe || echo 'MISSING (片段校验将退回 ffmpeg)')"

      - name: 渲染分片 ${{ matrix.shard }}
        env:
          TASK_ID: ${{ needs.pipeline.outputs.task_id }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLE_SUBTITLE: ${{ needs.pipeline.outputs.enable_subtitle }}
        shell: bash
        run: |
          cmd=(
            "python" "main.py"
            "--render-shard" "${{ matrix.shard }}"
            "--render-shards" "4"
            "--render-workers" "4"
            "--task-id" "$TASK_ID"
            "--output-dir" "./output"
            "--callback-url" "$CALLBACK_URL"
            "--callback-secret" "$CALLBACK_SECRET"
            "--r2-prefix" "tasks/$TASK_ID"
            "--r2-bucket" "$R2_BUCKET_NAME"
            "--r2-access-key-id" "$R2_ACCESS_KEY_ID"
            "--r2-secret-access-key" "$R2_SECRET_ACCESS_KEY"
            "--r2-endpoint" "$R2_ENDPOINT_URL"
          )

          if [ "$ENABLE_SUBTITLE" = "false" ]; then
            cmd+=("--no-subtitle")
          fi

          echo "Running render shard ${{ matrix.shard }}: ${cmd[*]}"
          "${cmd[@]}"
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "::error::Render shard ${{ matrix.shard }} failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: 发送错误回调
        if: ${{ failure() }}
        shell: bash
        env:
          TASK_ID: ${{ needs.pipeline.outputs.task_id }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          payload=$(python3 -c "
          import json, hmac, hashlib, base64, os
          body = json.dumps({'task_id': os.environ['TASK_ID'], 'phase': 'VIDEO_COMPOSE', 'status': 'failed', 'error': 'Render shard ${{ matrix.shard }} failed'})
          sig = base64.b64encode(hmac.new(os.environ['CALLBACK_SECRET'].encode(), body.encode(), hashlib.sha256).digest()).decode()
          print(json.dumps({'payload': body, 'signature': sig}))
          ")
          payload_body=$(echo "$payload" | python3 -c "import sys,json; print(json.load(sys.stdin)['payload'])")
          payload_sig=$(echo "$payload" | python3 -c "import sys,json; print(json.load(sys.stdin)['signature'])")
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Signature: $payload_sig" \
            -d "$payload_body" || true

  # ══════════════════════════════════════════════════════════════
  # Job 3: Assembly — 下载所有片段，拼接最终视频
  # 所有渲染分片完成后执行
  # ══════════════════════════════════════════════════════════════
  assembly:
    needs: [render, pipeline, setup-deps]
    # 重渲染模式不需要拼接 job（main.py 的 rerender 模式已处理拼接）
    if: ${{ needs.pipeline.outputs.rerender_clips == '' }}
    runs-on: ubuntu-latest
    # apt 安装（含 61MB 字体）在慢网络下可能耗时较久，给足预算避免装配阶段被超时取消
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 下载 apt 包并离线安装
        uses: actions/download-artifact@v4
        with:
          name: apt-packages
          path: /tmp/apt-packages
      - name: 离线安装系统依赖
        run: |
          # 从 artifact 中的 .deb 文件离线安装，无需访问 Ubuntu 镜像源
          cd /tmp/apt-packages
          tar xzf apt-packages.tar.gz
          sudo dpkg -i *.deb 2>/dev/null || sudo apt-get install -f -y -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          sudo rm -rf /var/lib/apt/lists/*

      - name: 下载 core 依赖 wheels
        uses: actions/download-artifact@v4
        with:
          name: py-wheels-core
          path: /tmp/py-wheels

      - name: 安装 Python 依赖（离线优先）
        run: |
          # assembly 只需轻量依赖（不含 torch/transformers）
          # 优先从 setup-deps 预下载的 wheels 离线安装，失败则回退在线
          tar xzf /tmp/py-wheels/py-wheels-core.tar.gz -C /tmp/py-wheels
          pip install --no-index --find-links /tmp/py-wheels -r requirements-core.txt \
            || pip install -r requirements-core.txt

      - name: 配置 ffmpeg 路径
        run: |
          ffmpegPath=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          if [ -n "$ffmpegPath" ]; then
            echo "IMAGEIO_FFMPEG_EXE=$ffmpegPath" >> $GITHUB_ENV
            echo "ffmpeg: $ffmpegPath"
          fi
          echo "ffprobe: $(command -v ffprobe || echo 'MISSING (片段校验将退回 ffmpeg)')"

      - name: 拼接最终视频
        env:
          TASK_ID: ${{ needs.pipeline.outputs.task_id }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLE_SUBTITLE: ${{ needs.pipeline.outputs.enable_subtitle }}
          BGM_KEY: ${{ needs.pipeline.outputs.bgm_key }}
          LANGUAGE: ${{ needs.pipeline.outputs.language }}
          TITLE: ${{ needs.pipeline.outputs.title }}
          ORIENTATION: ${{ needs.pipeline.outputs.orientation }}
        shell: bash
        run: |
          cmd=(
            "python" "main.py"
            "--assemble-mode"
            "--task-id" "$TASK_ID"
            "--title" "$TITLE"
            "--orientation" "$ORIENTATION"
            "--output-dir" "./output"
            "--callback-url" "$CALLBACK_URL"
            "--callback-secret" "$CALLBACK_SECRET"
            "--r2-prefix" "tasks/$TASK_ID"
            "--r2-bucket" "$R2_BUCKET_NAME"
            "--r2-access-key-id" "$R2_ACCESS_KEY_ID"
            "--r2-secret-access-key" "$R2_SECRET_ACCESS_KEY"
            "--r2-endpoint" "$R2_ENDPOINT_URL"
          )

          if [ "$ENABLE_SUBTITLE" = "false" ]; then
            cmd+=("--no-subtitle")
          fi

          if [ -n "$BGM_KEY" ]; then
            if [[ "$BGM_KEY" == bgm/* ]]; then
              bgm_filename=$(basename "$BGM_KEY")
              local_bgm="assets/bgm/$bgm_filename"
              echo "BGM_KEY is custom upload, downloading from R2: $BGM_KEY -> $local_bgm"
              npx --yes wrangler r2 object get "$R2_BUCKET_NAME/$BGM_KEY" --file "$local_bgm" --remote 2>&1
              if [ $? -ne 0 ]; then
                echo "::error::Failed to download custom BGM from R2"
                exit 1
              fi
              cmd+=("--bgm" "$local_bgm")
            else
              cmd+=("--bgm" "assets/bgm/$BGM_KEY")
            fi
          fi

          echo "Running assembly: ${cmd[*]}"
          "${cmd[@]}"
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "::error::Assembly failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: 上传视频产物
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ needs.pipeline.outputs.task_id }}
          path: output/**/*.mp4
          retention-days: 7
